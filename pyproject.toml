[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "math153-tutor"
version = "0.0.0"
description = "Source-grounded adaptive Math 153 review system"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "streamlit>=1.38",
  "sympy>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
math153-tutor = "math153_tutor.app:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["math153_streamlit_deploy_fix"]

[tool.mypy]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
